<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Make Game Boy chiptunes and sound effects in your browser." />
    <title>Dotmatrix Pocket: a Game Boy chiptune studio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' rx='1' fill='%2356566a'/%3E%3Crect x='1' y='1' width='6' height='4' fill='%23c5cea0'/%3E%3Cpath fill='%231e2419' d='M2 2h1v2H2zM4 3h1v1H4zM5 2h1v1H5z'/%3E%3Ccircle cx='6' cy='6.5' r='.8' fill='%23e2508d'/%3E%3C/svg%3E"
    />
    <!-- The saved theme and screen palette apply before the first paint. -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem("dotmatrix.prefs") || "{}"),
          r = document.documentElement;
        if (p.theme === "light" || p.theme === "dark") r.dataset.theme = p.theme;
        if (["pocket", "dusk", "ice"].includes(p.lcd)) r.dataset.lcd = p.lcd;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
